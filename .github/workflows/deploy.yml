name: Deploy DietShift Atlas to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and Unit Tests
        run: |
          npm run lint
          npm test

      - name: Setup Python and install validation + Playwright dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python validation & Playwright Chromium
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install chromium --with-deps

      - name: Build DietShift Atlas
        run: npm run build

      - name: Run Python Data Validation, JSON-Parquet Parity & Playwright E2E Gate
        run: python -m pytest -v

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
