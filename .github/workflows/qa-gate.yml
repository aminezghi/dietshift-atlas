name: DietShift Atlas QA Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: 'qa-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  qa-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python validation & Playwright Chromium dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install chromium --with-deps

      - name: Run full Phase 5C CI Quality Gate
        run: python scripts/run_qa_gate.py
